# Fabric / loom 在配置阶段要连 maven.fabricmc.net。该域名走 PowerShell 的系统 TLS 栈会超时，
# 但 JVM 自己的 HTTPS 栈是通的（实测 200 / 696ms），所以这里不需要额外绕过。
org.gradle.jvmargs=-Xmx3G -Dsun.net.client.defaultConnectTimeout=15000 -Dsun.net.client.defaultReadTimeout=30000
org.gradle.daemon=false
org.gradle.configureondemand=false
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
# Gradle 8.10 + loom 需要 JDK 17
#[org.gradle.java.home] set per machine, or rely on JAVA_HOME (JDK 17)

# Minecraft 1.20.1 / Fabric
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.10
fabric_version=0.92.12+1.20.1

mod_version=0.1.0
maven_group=com.example.soulbrand
archives_base_name=soulbrand
# mcstudio_asset_gen 读这个键定位资源目录。fabric.mod.json 的 id 是硬编码 "soulbrand"，
# 不是 ${mod_id} 占位符，所以这行只给工具用，不参与构建替换。
mod_id=soulbrand
